name: Scrape OvationTix Shows

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: 'Enable discovery mode (saves screenshots + HTML for debugging selectors)'
        type: boolean
        default: false
      webhook_type:
        description: 'Webhook format: discord, slack, or generic (auto-detects from URL if empty)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libcups2 libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Run scraper
        working-directory: scraper
        env:
          DISCOVERY_MODE: ${{ inputs.discovery_mode || 'false' }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ inputs.webhook_type || '' }}
        run: node scrape.js

      - name: Upload discovery artifacts
        if: always() && (inputs.discovery_mode || failure())
        uses: actions/upload-artifact@v4
        with:
          name: discovery-screenshots
          path: scraper/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/shows.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/shows.json
          git commit -m "Update shows data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
