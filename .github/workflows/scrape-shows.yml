name: Scrape OvationTix Shows

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: 'Enable discovery mode (saves screenshots + HTML for debugging selectors)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Run scraper
        working-directory: scraper
        env:
          DISCOVERY_MODE: ${{ inputs.discovery_mode || 'false' }}
        run: node scrape.js

      - name: Upload discovery artifacts
        if: inputs.discovery_mode
        uses: actions/upload-artifact@v4
        with:
          name: discovery-screenshots
          path: scraper/screenshots/
          retention-days: 7

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/shows.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/shows.json
          git commit -m "Update shows data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
